name = "tariff-billing-engine"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restoring this biller is the work of a utility revenue-assurance or billing-systems engineer working a regulatory mis-billing docket alongside a rate analyst, and it is a genuinely dependent chain rather than a single repair. The shipped effective rate table fell behind the docket, so the first step is to rebuild /app/data/effective_rate_table.json by consolidating the filed base tariff with the amendment filings under the commission's final decision -- approved filings only, ordered by effective date then filing date then filing identifier, a later filing superseding an earlier one for the same bracket, a retired bracket reinstated by a later add filing, one cumulative schedule version per distinct effective date, and filing bookkeeping stripped. Every bill is wrong if that consolidation is wrong, and two superseded entries (a January draft that walks the filings in file order and keeps the last one per bracket, a February interim that orders by filing date alone, consolidates pending filings and treats retirement as permanent) are there to be traced past. Only then can the engineer reconstruct the piecewise bracket arithmetic itself from a long, mostly-noise decision log rather than a specification: the inclusive bracket boundary, the ceiling-prorated bracket thresholds, the floored consumption split with the residual on the final segment, the capacity charge and its metered-peak ratchet, the half-up minimum-bill floor, the levy charged after that floor, and the service-class precedence between the register and the read all have to be traced to their final dated decision, with each rounding direction fixed independently -- getting one direction wrong changes the money. Before any of that arithmetic runs, the reads themselves have to be taken in as the contract says: the two figures coerce through int(str(value).strip()), then int(float(...)), then zero, so a boolean is worth nothing rather than the one Python would make of it; a read_id collapses its internal whitespace and trims its ends, and that collapsed form is the identity a read is deduplicated on; and a period date is a date only in the exact form YYYY-MM-DD, so the compact and week forms that date.fromisoformat accepts, and a value padded with spaces, are not dates and drop the read. These are the quietest rules in the docket and the easiest to satisfy with a permissive parser that looks right, and a read admitted or dropped wrongly moves every figure computed from it. All money is integer minor units, so a floating-point or decimal-typed subtotal rounds differently and is rejected. The data is synthetic: accounts, reads, dockets and filings were written for this exercise and no real customer or utility record appears anywhere in it. Holding the consolidation semantics and the whole interacting rule set in mind at once is what separates a correct reconstruction from a plausible-looking one.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/consolidate_rate_table.py, which implements the commission's final consolidation decision (#TAR-7370): keep only filings whose status is approved, sort them by (effective_date, filed_on, filing_id), apply them cumulatively over /app/data/base_tariff.json -- replace-bracket and add-bracket both write over any bracket already holding that bracket_id (so a later add reinstates a retired one), retire-bracket removes it, adjust-demand-charge sets the class rate -- emit one schedule version per distinct effective date plus the base version, sort schedules, class keys and brackets, drop every filing bookkeeping field, and write the table back over the stale /app/data/effective_rate_table.json. Step two copies solution/rate_bill_fixed.py over /app/workflow/rate_bill.py and runs it against that table. The biller canonicalizes and deduplicates reads under the final tie-break chain, cuts each billing period at every schedule effective date and every service-class transfer inside it, splits consumption by floored day share with the residual on the last segment, prorates each bracket ceiling upward, charges the brackets inclusively of their ceilings, adds the floored per-segment capacity charge over a ceiling ratchet on metered peaks, adds the exact standing charge, applies the half-up prorated minimum bill, then the floored levy on the post-floor subtotal, scores and admits bills, tiers and orders them, and applies the per-account cap after ordering. It writes exactly billing_summary.json, bill_register.json and compact exception_queue.jsonl into --output-dir. Every governing value is traced to its final entry in /app/incident/tariff_governance_log.md; report_spec.json supplies only the output contract and no derivation rule.'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the consolidated /app/data/effective_rate_table.json must equal the sealed expected table, must carry only tariff fields at every level, and the base tariff and filings must be left intact -- then the shipped stale table, a base-only table and a naive last-filing-wins table are each asserted different from it and the agent's own biller is re-run against all three and required to disagree with the sealed outputs and to bill a different money total, which is what makes the two steps provably dependent. Step two executes the agent's /app/workflow/rate_bill.py as a subprocess under an unprivileged uid (setpriv 65534, scrubbed environment, hard timeout) over both the primary meter reads and a held-out alternate read file, and diffs billing_summary.json, bill_register.json and exception_queue.jsonl against sealed fixtures generated from the reference. It also checks schema, field, sort, tiering and cap invariants, summary arithmetic, per-bill charge arithmetic, idempotency, the command-line defaults, and that the register and policy paths actually influence output. A static scan forbids importing decimal, fractions, pandas or numpy, and two lab tests prove the dialect: a bill whose consumption lands exactly on a bracket ceiling is charged wholly in that bracket rather than spilling, and the prorated minimum bill rounds half up where a float-and-round evaluation rounds the other way. The frozen broken snapshot /app/workflow/.rate_bill.original is asserted present and merely different from the correct output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1; a fresh environment with no solve.sh gives 0, and so does an environment where the biller is repaired but the rate table is never consolidated.'''
relevant_experience = '''Experience consolidating a regulatory rate schedule from a base filing plus dated amendment filings under supersession and reinstatement semantics, and reconstructing money-exact billing engines -- piecewise bracket arithmetic, proration across a mid-period rate change, capacity ratchets and minimum-bill floors -- from an authoritative but noisy decision log rather than a clean specification, tracing incrementally-revised rules to their final form, holding each stage's rounding direction separately, and matching a byte-level output contract in integer minor units.'''
